# Include inside nginx's http context. Replace domains and certificate paths.
# This example assumes Nginx runs on the same host as the supplied Compose file.
upstream media_gateway_s3 { server 127.0.0.1:9000; keepalive 32; }
upstream media_gateway_web { server 127.0.0.1:9001; keepalive 32; }
upstream media_gateway_manage { server 127.0.0.1:9002; keepalive 8; }

server {
    listen 443 ssl;
    server_name s3.example.com;
    ssl_certificate /etc/nginx/certs/s3.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/s3.key;
    client_max_body_size 0;
    location / {
        proxy_pass http://media_gateway_s3;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name media.example.com;
    ssl_certificate /etc/nginx/certs/media.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/media.key;
    location / {
        proxy_pass http://media_gateway_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate /etc/nginx/certs/admin.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.key;
    location / {
        proxy_pass http://media_gateway_manage;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
