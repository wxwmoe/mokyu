# Include inside nginx's http context. Replace domains and certificate paths.
# This example assumes Nginx runs on the same host as the supplied Compose file.
# Use Nginx 1.30.6+ or 1.31.7+ with ngx_http_v2_module and ngx_http_grpc_module.
# Ordinary upstreams use h2c; node RPC shares the control port.
upstream mokyu_s3 { server 127.0.0.1:9000; keepalive 32; }
upstream mokyu_web { server 127.0.0.1:9001; keepalive 32; }
upstream mokyu_control { server 127.0.0.1:9002; keepalive 8; }
# proxy and grpc use separate keepalive pools on the same control port.
upstream mokyu_control_rpc { server 127.0.0.1:9002; keepalive 32; }

# Optional control asset cache: uncomment both marked blocks to enable it.
# Create this directory with write permission for the nginx worker.
# BEGIN control cache
# proxy_cache_path /var/cache/nginx/mokyu levels=1:2 keys_zone=mokyu_control_assets:1m max_size=64m inactive=7d use_temp_path=off;
# map "$upstream_status:$upstream_http_cache_control" $mokyu_control_skip_cache {
#     default 1;
#     "200:public, max-age=31536000, immutable" 0;
# }
# END control cache

server {
    gzip off;
    listen 443 ssl;
    http2 on;
    server_name s3.example.com;
    ssl_certificate /etc/nginx/certs/s3.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/s3.key;
    client_max_body_size 0;
    location / {
        proxy_pass http://mokyu_s3;
        proxy_http_version 2;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header X-Mokyu-File-Delivery "";
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_set_header TE trailers;
        proxy_pass_trailers on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 120s;
    }
}

server {
    gzip off;
    listen 443 ssl;
    http2 on;
    server_name media.example.com;
    ssl_certificate /etc/nginx/certs/media.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/media.key;
    location / {
        proxy_pass http://mokyu_web;
        proxy_http_version 2;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header X-Mokyu-File-Delivery "";
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

server {
    gzip off;
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;
    ssl_certificate /etc/nginx/certs/admin.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.key;
    client_max_body_size 0;
    location ^~ /mokyu.node. {
        grpc_pass grpc://mokyu_control_rpc;
        grpc_set_header Host $http_host;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_connect_timeout 3s;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        grpc_socket_keepalive on;
        grpc_next_upstream off;
    }
    location / {
        proxy_pass http://mokyu_control;
        proxy_http_version 2;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    # BEGIN control cache
    # location ~ "^/assets/[A-Za-z0-9_.-]+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?)$" {
    #     proxy_pass http://mokyu_control;
    #     proxy_http_version 2;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header Accept-Encoding $http_accept_encoding;
    #     proxy_set_header Connection "";
