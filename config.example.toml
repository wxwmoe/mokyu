# For the single-container process or `mokyu control`.
# Data and worker use config.node.example.toml.
[database]
type = "postgres" # postgres | mysql | sqlite
host = "postgres"
port = 5432
name = "mokyu"
user = "mokyu"
password = "YOUR_POSTGRES_PASSWORD"
# Use password_file instead of password for Docker secrets.
#password_file = "secrets/postgres-password"
ssl_mode = "prefer"
# SQLite: keep only type = "sqlite" and optional path in this section.
# Defaults to instance.data_path/mokyu.db when path is omitted.
#path = "/data/mokyu.db"

# Optional PostgreSQL standby for control. No type or path field.
# Omit this section to use only the primary.
#[replica_database]
#host = "postgres-replica"
# port, name, user and ssl_mode inherit database; name must match.
# Set password/password_file when specifying a separate user.
#user = "mokyu_reader"
#password_file = "secrets/replica-password"

[instance]
# Generate once with `mokyu tool keygen`; keep it on single/control only.
deployment_key = "REPLACE_WITH_MOKYU_TOOL_KEYGEN_OUTPUT"
# Control must set a unique name; the single container defaults to `single`.
#name = "control-1"

# Listeners
listen_control = "0.0.0.0:9002"
listen_web = "0.0.0.0:9001"
listen_s3 = "0.0.0.0:9000"

# Local directories
data_path = "/data"
min_free_space = "1GiB"

# Upload and cache limits
#multipart_limit = "2GB"
#cache_size = "10GiB"
#cache_entries = 65536
response_cache_size = "64MiB" # Public response memory; omitted or 0B disables it.
write_memory_size = "64MiB" # Optional single-container volatile S3 writes; omitted or 0B disables RAM.
#upload_cache_size = "2GiB"
thumbnail_cache_size = "256MiB"

# Connection pools and resource budgets
# Sized for the 1GiB Compose example with the default 32MiB S3 packs.
# Pack read/work memory uses the remaining budget automatically.
#request_connections = 128
#database_connections = 12
#database_read_connections = 3 # Optional standby pool; requires replica_database.
#cpu_jobs = 2
stream_memory_budget = "256MiB"
#storage_read_slots = 16
#storage_upload_slots = 4
#storage_control_slots = 2
compression_idle_timeout = "30s"
