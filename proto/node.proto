syntax = "proto3";
package mokyu.node.v1;

service NodeControl {
  rpc PrepareRequest(PrepareRequestInput) returns (RequestReply);
  rpc SyncNode(SyncRequest) returns (SyncReply);
  rpc ReportNode(NodeReportRequest) returns (NodeReportReply);
  rpc CloseNode(CloseNodeRequest) returns (CloseNodeReply);
  rpc ReportObservations(ObservationRequest) returns (ObservationReply);
}

message NodeReportRequest {
  Run run = 1;
  bytes report_json = 2;
  uint64 sample_interval_seconds = 3;
}

message NodeReportReply {
  bool accepted = 1;
}

message CloseNodeRequest {
  Run run = 1;
}

message CloseNodeReply {}

message CompressionObservation {
  string stream_id = 1;
  uint32 version = 2;
  string encoding = 3;
  uint64 size = 4;
}

message ObservationRequest {
  Run run = 1;
  repeated CompressionObservation compression = 2;
  repeated string credentials = 3;
  optional bytes access_json = 4;
}

message ObservationReply {
  repeated bool compression_written = 1;
}

// A separate service enforces the smaller stream message limit before decoding.
service NodeSessions {
  rpc NodeSession(stream SessionRequest) returns (stream SessionReply);
}

service NodeWork {
  rpc Exchange(WorkRequest) returns (WorkReply);
  rpc ReadMigration(ReadMigrationRequest) returns (ReadReply);
}

message ReadMigrationRequest {
  Run run = 1;
  string operation_id = 2;
  repeated Cached cached = 3;
}

message WorkRequest {
  Run run = 1;
  string operation_id = 2;
  optional bytes completion_json = 3;
  uint32 class = 4;
  uint32 max_items = 5;
  repeated Cached cached = 6;
}

message WorkReply {
  string operation_id = 1;
  optional bytes plan_json = 2;
  repeated Material materials = 3;
  repeated Grant grants = 4;
}

service NodeReads {
  rpc OpenRead(ReadRequest) returns (ReadReply);
  rpc ReadWindow(ReadWindowRequest) returns (ReadReply);
  rpc ReportRead(ReadReportRequest) returns (ReadReportReply);
}

service NodeWrites {
  rpc BeginWrite(BeginWriteRequest) returns (WriteReply);
  rpc WriteStatus(WriteRequest) returns (WriteReply);
  rpc AbortWrite(WriteRequest) returns (WriteReply);
  rpc PrepareChunks(PrepareChunksRequest) returns (PreparedChunks);
  rpc CommitChunks(CommitChunksRequest) returns (ChunkCommitReply);
  rpc CopyChunks(CopyChunksRequest) returns (ChunkCommitReply);
  rpc PrepareRaw(PrepareRawRequest) returns (PreparedRaw);
  rpc PrepareLocalPart(PrepareLocalPartRequest) returns (WriteReply);
  rpc CommitRaw(CommitRawRequest) returns (PreparedRaw);
  rpc CheckRawFiles(LocalFilesRequest) returns (FilesReply);
  rpc PrepareTail(PrepareTailRequest) returns (PreparedTail);
  rpc CommitTail(WriteRequest) returns (PreparedTail);
  rpc PublishWrite(PublishWriteRequest) returns (WriteReply);
}

service NodeObjects {
  rpc ChangeObjects(ChangeObjectsRequest) returns (ChangeObjectsReply);
}

service NodeMultipart {
  rpc CreateMultipart(CreateMultipartRequest) returns (MultipartReply);
  rpc AbortMultipart(AbortMultipartRequest) returns (MultipartReply);
  rpc BeginComplete(BeginCompleteRequest) returns (WriteReply);
  rpc ReadComplete(ReadCompleteRequest) returns (CompleteSources);
  rpc CompleteStatus(CompleteStatusRequest) returns (CompleteState);
  rpc ClaimNative(NativeClaimRequest) returns (NativeWorkReply);
  rpc FinishNative(NativeFinishRequest) returns (NativeFinishReply);
  rpc CheckLocalFiles(LocalFilesRequest) returns (FilesReply);
  rpc PrepareNativeComplete(NativeCompleteRequest) returns (NativeCompleteReply);
  rpc AdoptNativeComplete(AdoptNativeRequest) returns (WriteReply);
}

message PrepareLocalPartRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 size = 3;
  repeated bytes hashes = 4;
}

message NativeClaimRequest {
  Run run = 1;
  string operation_id = 2;
  optional string stream_id = 3;
  repeated Cached cached = 4;
}

message NativeWorkReply {
  string operation_id = 1;
  optional bytes work_json = 2;
  bool ready = 3;
  repeated Material materials = 4;
  Cached storage = 5;
  repeated Grant grants = 6;
}

message NativeFinishRequest {
  Run run = 1;
  string operation_id = 2;
  optional string value = 3;
  bool retry = 4;
  optional LocalSourceError source_error = 5;
}

enum LocalSourceError {
  LOCAL_SOURCE_ERROR_UNSPECIFIED = 0;
  LOCAL_SOURCE_MISSING = 1;
  LOCAL_SOURCE_CORRUPT = 2;
}

message NativeFinishReply {}

message LocalFilesRequest {
  Run run = 1;
  repeated string files = 2;
  bool recover = 3;
}

message NativeCompleteRequest {
  Run run = 1;
  string operation_id = 2;
  bool resend = 3;
}

message NativeCompleteReply {
  bytes completion_json = 1;
  repeated Grant grants = 2;
}

message AdoptNativeRequest {
  Run run = 1;
  string operation_id = 2;
  bytes digest = 3;
  bytes content_hash = 4;
}

message CompleteStatusRequest {
  Run run = 1;
  string access_key = 2;
  optional uint64 credential_revision = 3;
  string bucket = 4;
  string key = 5;
  string upload_id = 6;
  string manifest_hash = 7;
}

message CompleteState {
  WritePhase phase = 1;
  bytes summary_json = 2;
}

message BeginCompleteRequest {
  Run run = 1;
  string operation_id = 2;
  string access_key = 3;
  optional uint64 credential_revision = 4;
  string bucket = 5;
  string key = 6;
  bytes manifest_json = 7;
  repeated Cached cached = 8;
}

message ReadCompleteRequest {
  Run run = 1;
  string operation_id = 2;
  uint32 first = 3;
  repeated string read_operations = 4;
  repeated Cached cached = 5;
  repeated string shared_permits = 6;
}

message CompleteSources {
  uint32 first = 1;
  optional uint32 next = 2;
  repeated ReadReply parts = 3;
}

message CreateMultipartRequest {
  Run run = 1;
  string operation_id = 2;
  string access_key = 3;
  optional uint64 credential_revision = 4;
  string bucket = 5;
  string key = 6;
  bytes metadata_json = 7;
  bool public_read = 8;
  optional string algorithm = 9;
  optional string checksum_type = 10;
}

message AbortMultipartRequest {
  Run run = 1;
  string operation_id = 2;
  string access_key = 3;
  optional uint64 credential_revision = 4;
  string bucket = 5;
  string key = 6;
  string upload_id = 7;
  optional string initiated = 8;
}

message MultipartReply {
  optional string upload_id = 1;
}

message ChangeObjectsRequest {
  Run run = 1;
  string operation_id = 2;
  string access_key = 3;
  optional uint64 credential_revision = 4;
  string bucket = 5;
  repeated string keys = 6;
  // Absent deletes the selected keys; present changes one object's canned ACL.
  optional bool public_read = 7;
}

message ChangeObjectsReply {
  ObjectChangeOutcome outcome = 1;
}

enum ObjectChangeOutcome {
  OBJECT_CHANGE_OUTCOME_UNSPECIFIED = 0;
  APPLIED = 1;
  OBJECT_CHANGE_NO_SUCH_KEY = 2;
}

message PrepareRawRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 size = 3;
  bytes digest = 4;
  bytes content_hash = 5;
  bool local = 6;
}

message FilesReply {
  bytes files_json = 1;
}

message CommitRawRequest {
  Run run = 1;
  string operation_id = 2;
  string source_id = 3;
}

message PreparedRaw {
  string source_id = 1;
  uint64 size = 2;
  bool committed = 3;
  repeated Grant grants = 4;
}

message ChunkInput {
  bytes hash = 1;
  uint32 raw_size = 2;
  bytes payload_hash = 3;
  uint32 payload_size = 4;
  bool compressed = 5;
}

message PrepareChunksRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 batch_id = 3;
  uint64 offset = 4;
  repeated ChunkInput chunks = 5;
  uint32 parallelism = 6;
  repeated Cached cached = 7;
}

message PreparedChunk {
  uint64 offset = 1;
  bytes chunk_json = 2;
  bool reused = 3;
  bytes payload_hash = 4;
}

message PreparedChunks {
  uint64 batch_id = 1;
  uint64 end = 2;
  bool committed = 3;
  repeated PreparedChunk chunks = 4;
  repeated Material materials = 5;
  Cached storage = 6;
  repeated Grant grants = 7;
  optional bytes packing_json = 8;
}

message EncodedChunk {
  string chunk_id = 1;
  bytes digest = 2;
}

message CommitChunksRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 batch_id = 3;
  repeated EncodedChunk chunks = 4;
  optional bytes packed_json = 5;
}

message ChunkCommitReply {
  uint64 batch_id = 1;
  uint64 end = 2;
}

message CopyChunksRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 batch_id = 3;
  uint64 offset = 4;
}

message PublishWriteRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 size = 3;
  string etag = 4;
  bytes checksums_json = 5;
  optional string if_match = 6;
  optional string if_none = 7;
}

message PublishedWrite {
  uint64 size = 1;
  string etag = 2;
  string last_modified = 3;
}

message BeginWriteRequest {
  Run run = 1;
  string operation_id = 2;
  string access_key = 3;
  string bucket = 4;
  string key = 5;
  bytes metadata_json = 6;
  bool public_read = 7;
  optional uint64 size = 8;
  repeated Cached cached = 9;
  optional uint64 credential_revision = 10;
  optional string copy_read_id = 11;
  WritePart part = 12;
}

message WritePart {
  string upload_id = 1;
  int32 number = 2;
  optional string algorithm = 3;
}

message PrepareTailRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 offset = 3;
  uint32 size = 4;
  bytes hash = 5;
  repeated Cached cached = 6;
}

message PreparedTail {
  string fragment_id = 1;
  string object_key = 2;
  uint64 end = 3;
  bool committed = 4;
  repeated Material materials = 5;
  Cached storage = 6;
  repeated Grant grants = 7;
}

message PrepareRequestInput {
  Run run = 1;
  string access_key = 2;
  string bucket = 3;
  repeated MaterialType include = 4;
  repeated Cached cached = 5;
  oneof query {
    DescribeBucketQuery describe_bucket = 6;
    ObjectAclQuery object_acl = 9;
    ListBucketsQuery list_buckets = 7;
    ListObjectsQuery list_objects = 8;
    ListUploadsQuery list_uploads = 10;
    ListPartsQuery list_parts = 11;
  }
}

message DescribeBucketQuery {}

message ObjectAclQuery { string key = 1; }

message ListUploadsQuery {
  optional string prefix = 1;
  optional string delimiter = 2;
  optional string key_marker = 3;
  optional string upload_marker = 4;
  int32 limit = 5;
}

message ListPartsQuery {
  string key = 1;
  string upload_id = 2;
  int32 marker = 3;
  int32 limit = 4;
}

message ListBucketsQuery {
  optional string prefix = 1;
  optional string region = 2;
  optional string token = 3;
  int32 limit = 4;
}

message ListObjectsQuery {
  optional string prefix = 1;
  optional string delimiter = 2;
  optional string after = 3;
  optional string token = 4;
  int32 limit = 5;
}

message RequestReply {
  ReadOutcome outcome = 1;
  repeated Material materials = 2;
  Cached credential = 3;
  Cached bucket = 4;
  Cached policy = 5;
  bytes catalog_json = 6;
}

message WriteRequest {
  Run run = 1;
  string operation_id = 2;
}

enum WritePhase {
  WRITE_PHASE_UNSPECIFIED = 0;
  WRITE_ACTIVE = 1;
  WRITE_ABORTED = 2;
  WRITE_EXPIRED = 3;
  WRITE_PUBLISHED = 4;
  WRITE_BUSY = 5;
}

message WriteReply {
  string operation_id = 1;
  string stream_id = 2;
  WritePhase phase = 3;
  repeated Material materials = 4;
  Cached storage = 5;
  repeated Grant grants = 6;
  PublishedWrite published = 7;
  string bucket_id = 8;
  bool copy_references = 9;
  optional string checksum_algorithm = 10;
  optional bytes completion_json = 11;
}

// Suspicions request durable backend verification; they never prove corruption.
message ReadReportRequest {
  Run run = 1;
  string read_id = 2;
  string window_id = 3;
  repeated uint32 segments = 4;
}

message ReadReportReply {
  repeated string task_ids = 1;
}

message Run {
  string boot_id = 1;
  string fence = 2;
}

message Hello {
  uint32 protocol = 1;
  string boot_id = 2;
  string connection_id = 3;
  uint64 previous_epoch = 4;
}

message Pulse {
  uint64 sequence = 1;
  bool draining = 2;
  repeated GrantRef renew = 3;
  repeated GrantRef release = 4;
}

message SessionRequest {
  oneof message {
    Hello hello = 1;
    Pulse pulse = 2;
    Receipt receipt = 3;
  }
}

enum Section {
  SECTION_UNSPECIFIED = 0;
  REQUESTS = 1;
  UPLOADS = 2;
  METRICS = 3;
  MAINTENANCE = 4;
  IO = 5;
}

message Revision {
  Section section = 1;
  uint64 revision = 2;
}

message NodeState {
  bool maintenance = 1;
  bool draining = 2;
  repeated Revision revisions = 3;
  bool native_pending = 4;
  bool work_pending = 5;
  uint64 pending_uploads = 6;
}

message Welcome {
  Run run = 1;
  uint64 epoch = 2;
  uint64 valid_for_ms = 3;
  NodeState state = 4;
  string control_id = 5;
}

message PulseReply {
  uint64 sequence = 1;
  uint64 valid_for_ms = 2;
  NodeState state = 3;
  repeated GrantResult grants = 4;
}

message ObjectChange {
  string bucket_id = 1;
  string key = 2;
}

message Invalidation {
  string event_id = 1;
  oneof target {
    ObjectChange object = 2;
    string bucket_id = 3;
    string storage_id = 4;
  }
}

message Notice {
  repeated Invalidation changes = 1;
  bool reset = 2;
  bool state_changed = 3;
}

message Receipt {
  repeated string applied = 1;
}

message SessionReply {
  oneof message {
    Welcome welcome = 1;
    PulseReply pulse = 2;
    Notice notice = 3;
  }
}

message SyncRequest {
  Run run = 1;
  repeated Revision cached = 2;
}

message Settings {
  Revision version = 1;
  bytes json = 2;
}

message SyncReply {
  uint64 valid_for_ms = 1;
  NodeState state = 2;
  repeated Settings settings = 3;
}

enum ReadMethod {
  READ_METHOD_UNSPECIFIED = 0;
  GET = 1;
  HEAD = 2;
}

enum ReadSurface {
  READ_SURFACE_UNSPECIFIED = 0;
  S3 = 1;
  WEB = 2;
}

enum ReadInclude {
  READ_INCLUDE_UNSPECIFIED = 0;
  OBJECT = 1;
  MAPPING = 2;
  POLICY = 3;
  PROTECTION = 4;
}

message BucketRoute {
  string name = 1;
  string key = 2;
  string alias_name = 3;
  string alias_key = 4;
}

message HostRoute {
  string host = 1;
  string key = 2;
}

message ReadRoute {
  oneof route {
    BucketRoute bucket = 1;
    HostRoute host = 2;
  }
}

message ReadHeader {
  string name = 1;
  bytes value = 2;
}

enum MaterialType {
  MATERIAL_TYPE_UNSPECIFIED = 0;
  BUCKET = 1;
  OBJECT_METADATA = 2;
  OBJECT_MAPPING = 3;
  STORAGE = 4;
  BLOCK_KEY = 5;
  S3_CREDENTIAL = 6;
  READ_POLICY = 7;
}

// Revisions bind deployment, purpose, identity and material; never authorization.
message Cached {
  MaterialType type = 1;
  string id = 2;
  bytes revision = 3;
}

message Material {
  Cached version = 1;
  oneof value {
    bytes json = 2;
    bool reuse = 3;
  }
}

message ReadRequest {
  Run run = 1;
  string operation_id = 2;
  ReadRoute route = 3;
  string access_key = 4;
  ReadMethod method = 5;
  ReadSurface surface = 6;
  repeated ReadInclude include = 7;
  repeated ReadHeader headers = 8;
  repeated Cached cached = 9;
  uint32 max_items = 10;
  uint32 max_bytes = 11;
  repeated ReadHeader overrides = 12;
  CachedBody body = 13;
}

// The client pins these verified bytes until the request finishes.
message CachedBody {
  Cached object = 1;
  string representation = 2;
  uint32 policy = 3;
  Cached mapping = 4;
  repeated Cached storages = 5;
  bool verified = 6;
}

message ReadCursor {
  string lease_id = 1;
  string stream_id = 2;
  uint64 payload_revision = 3;
  uint64 offset = 4;
  uint64 end = 5;
}

message ReadWindowRequest {
  Run run = 1;
  reserved 2;
  ReadCursor cursor = 3;
  repeated Cached cached = 4;
  uint32 max_items = 5;
  uint32 max_bytes = 6;
}

enum ReadOutcome {
  READ_OUTCOME_UNSPECIFIED = 0;
  READY = 1;
  NO_SUCH_BUCKET = 2;
  NO_SUCH_KEY = 3;
  ACCESS_DENIED = 4;
  NOT_MODIFIED = 5;
  PRECONDITION_FAILED = 6;
  INVALID_RANGE = 7;
  PENDING = 8;
  NOT_ACCEPTABLE = 9;
}

enum GrantType {
  GRANT_TYPE_UNSPECIFIED = 0;
  READ_PROTECTION = 1;
  STORAGE_READ = 2;
  READ_WINDOW = 3;
  WRITE_PROTECTION = 4;
  STORAGE_WRITE = 5;
  NATIVE_WORK = 6;
  TASK_WORK = 7;
}

message Grant {
  GrantType type = 1;
  string id = 2;
  uint64 valid_for_ms = 3;
  string storage_id = 4;
}

message GrantRef {
  GrantType type = 1;
  string id = 2;
}

message GrantResult {
  GrantRef grant = 1;
  bool accepted = 2;
  uint64 valid_for_ms = 3;
}

message ReadReply {
  ReadOutcome outcome = 1;
  repeated Material materials = 2;
  Cached bucket = 3;
  Cached object = 4;
  Cached mapping = 5;
  Cached credential = 6;
  repeated Grant grants = 7;
  ReadCursor next = 8;
  uint64 offset = 9;
  uint64 length = 10;
  uint32 http_status = 11;
  string representation = 12;
  string etag = 13;
  bool body_reused = 14;
  Cached policy = 15;
}
