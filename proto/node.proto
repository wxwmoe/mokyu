syntax = "proto3";
package mokyu.node.v1;

service NodeControl {
  rpc SyncNode(SyncRequest) returns (SyncReply);
  rpc ReportObservations(ObservationRequest) returns (ObservationReply);
}

message CompressionObservation {
  string stream_id = 1;
  uint32 version = 2;
  string encoding = 3;
  uint64 size = 4;
}

message ObservationRequest {
  Run run = 1;
  repeated CompressionObservation compression = 2;
  repeated string credentials = 3;
}

message ObservationReply {
  repeated bool compression_written = 1;
}

// A separate service enforces the smaller stream message limit before decoding.
service NodeSessions {
  rpc NodeSession(stream SessionRequest) returns (stream SessionReply);
}

service NodeReads {
  rpc OpenRead(ReadRequest) returns (ReadReply);
  rpc ReadWindow(ReadWindowRequest) returns (ReadReply);
  rpc ReportRead(ReadReportRequest) returns (ReadReportReply);
}

service NodeWrites {
  rpc BeginWrite(BeginWriteRequest) returns (WriteReply);
  rpc WriteStatus(WriteRequest) returns (WriteReply);
  rpc AbortWrite(WriteRequest) returns (WriteReply);
  rpc PrepareChunks(PrepareChunksRequest) returns (PreparedChunks);
  rpc CommitChunks(CommitChunksRequest) returns (ChunkCommitReply);
  rpc PublishWrite(PublishWriteRequest) returns (WriteReply);
}

message ChunkInput {
  bytes hash = 1;
  uint32 raw_size = 2;
  bytes payload_hash = 3;
  uint32 payload_size = 4;
  bool compressed = 5;
}

message PrepareChunksRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 batch_id = 3;
  uint64 offset = 4;
  repeated ChunkInput chunks = 5;
  uint32 parallelism = 6;
  repeated Cached cached = 7;
}

message PreparedChunk {
  uint64 offset = 1;
  bytes chunk_json = 2;
  bool reused = 3;
  bytes payload_hash = 4;
}

message PreparedChunks {
  uint64 batch_id = 1;
  uint64 end = 2;
  bool committed = 3;
  repeated PreparedChunk chunks = 4;
  repeated Material materials = 5;
  Cached storage = 6;
  repeated Grant grants = 7;
}

message EncodedChunk {
  string chunk_id = 1;
  bytes digest = 2;
}

message CommitChunksRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 batch_id = 3;
  repeated EncodedChunk chunks = 4;
}

message ChunkCommitReply {
  uint64 batch_id = 1;
  uint64 end = 2;
}

message PublishWriteRequest {
  Run run = 1;
  string operation_id = 2;
  uint64 size = 3;
  string etag = 4;
  bytes checksums_json = 5;
  optional string if_match = 6;
  optional string if_none = 7;
}

message PublishedWrite {
  uint64 size = 1;
  string etag = 2;
  string last_modified = 3;
}

message BeginWriteRequest {
  Run run = 1;
  string operation_id = 2;
  string access_key = 3;
  string bucket = 4;
  string key = 5;
  bytes metadata_json = 6;
  bool public_read = 7;
  optional uint64 size = 8;
  repeated Cached cached = 9;
}

message WriteRequest {
  Run run = 1;
  string operation_id = 2;
}

enum WritePhase {
  WRITE_PHASE_UNSPECIFIED = 0;
  WRITE_ACTIVE = 1;
  WRITE_ABORTED = 2;
  WRITE_EXPIRED = 3;
  WRITE_PUBLISHED = 4;
}

message WriteReply {
  string operation_id = 1;
  string stream_id = 2;
  WritePhase phase = 3;
  repeated Material materials = 4;
  Cached storage = 5;
  repeated Grant grants = 6;
  PublishedWrite published = 7;
}

// Suspicions request durable backend verification; they never prove corruption.
message ReadReportRequest {
  Run run = 1;
  string read_id = 2;
  string window_id = 3;
  repeated uint32 segments = 4;
}

message ReadReportReply {
  repeated string task_ids = 1;
}

message Run {
  string boot_id = 1;
  string fence = 2;
}

message Hello {
  uint32 protocol = 1;
  string boot_id = 2;
  string connection_id = 3;
  uint64 previous_epoch = 4;
}

message Pulse {
  uint64 sequence = 1;
  bool draining = 2;
  repeated GrantRef renew = 3;
  repeated GrantRef release = 4;
}

message SessionRequest {
  oneof message {
    Hello hello = 1;
    Pulse pulse = 2;
  }
}

enum Section {
  SECTION_UNSPECIFIED = 0;
  REQUESTS = 1;
  UPLOADS = 2;
  METRICS = 3;
  MAINTENANCE = 4;
  IO = 5;
}

message Revision {
  Section section = 1;
  uint64 revision = 2;
}

message NodeState {
  bool maintenance = 1;
  bool draining = 2;
  repeated Revision revisions = 3;
}

message Welcome {
  Run run = 1;
  uint64 epoch = 2;
  uint64 valid_for_ms = 3;
  NodeState state = 4;
}

message PulseReply {
  uint64 sequence = 1;
  uint64 valid_for_ms = 2;
  NodeState state = 3;
  repeated GrantResult grants = 4;
}

message SessionReply {
  oneof message {
    Welcome welcome = 1;
    PulseReply pulse = 2;
  }
}

message SyncRequest {
  Run run = 1;
  repeated Revision cached = 2;
}

message Settings {
  Revision version = 1;
  bytes json = 2;
}

message SyncReply {
  uint64 valid_for_ms = 1;
  NodeState state = 2;
  repeated Settings settings = 3;
}

enum ReadMethod {
  READ_METHOD_UNSPECIFIED = 0;
  GET = 1;
  HEAD = 2;
}

enum ReadSurface {
  READ_SURFACE_UNSPECIFIED = 0;
  S3 = 1;
  WEB = 2;
}

enum ReadInclude {
  READ_INCLUDE_UNSPECIFIED = 0;
  OBJECT = 1;
  MAPPING = 2;
  POLICY = 3;
}

message BucketRoute {
  string name = 1;
  string key = 2;
  string alias_name = 3;
  string alias_key = 4;
}

message HostRoute {
  string host = 1;
  string key = 2;
}

message ReadRoute {
  oneof route {
    BucketRoute bucket = 1;
    HostRoute host = 2;
  }
}

message ReadHeader {
  string name = 1;
  bytes value = 2;
}

enum MaterialType {
  MATERIAL_TYPE_UNSPECIFIED = 0;
  BUCKET = 1;
  OBJECT_METADATA = 2;
  OBJECT_MAPPING = 3;
  STORAGE = 4;
  BLOCK_KEY = 5;
  S3_CREDENTIAL = 6;
  READ_POLICY = 7;
}

// Revisions bind deployment, purpose, identity and material; never authorization.
message Cached {
  MaterialType type = 1;
  string id = 2;
  bytes revision = 3;
}

message Material {
  Cached version = 1;
  oneof value {
    bytes json = 2;
    bool reuse = 3;
  }
}

message ReadRequest {
  Run run = 1;
  string operation_id = 2;
  ReadRoute route = 3;
  string access_key = 4;
  ReadMethod method = 5;
  ReadSurface surface = 6;
  repeated ReadInclude include = 7;
  repeated ReadHeader headers = 8;
  repeated Cached cached = 9;
  uint32 max_items = 10;
  uint32 max_bytes = 11;
  repeated ReadHeader overrides = 12;
  CachedBody body = 13;
}

// The client pins these verified bytes until the request finishes.
message CachedBody {
  Cached object = 1;
  string representation = 2;
  uint32 policy = 3;
  Cached mapping = 4;
  repeated Cached storages = 5;
  bool verified = 6;
}

message ReadCursor {
  string lease_id = 1;
  string stream_id = 2;
  uint64 payload_revision = 3;
  uint64 offset = 4;
  uint64 end = 5;
}

message ReadWindowRequest {
  Run run = 1;
  reserved 2;
  ReadCursor cursor = 3;
  repeated Cached cached = 4;
  uint32 max_items = 5;
  uint32 max_bytes = 6;
}

enum ReadOutcome {
  READ_OUTCOME_UNSPECIFIED = 0;
  READY = 1;
  NO_SUCH_BUCKET = 2;
  NO_SUCH_KEY = 3;
  ACCESS_DENIED = 4;
  NOT_MODIFIED = 5;
  PRECONDITION_FAILED = 6;
  INVALID_RANGE = 7;
  PENDING = 8;
  NOT_ACCEPTABLE = 9;
}

enum GrantType {
  GRANT_TYPE_UNSPECIFIED = 0;
  READ_PROTECTION = 1;
  STORAGE_READ = 2;
  READ_WINDOW = 3;
  WRITE_PROTECTION = 4;
  STORAGE_WRITE = 5;
}

message Grant {
  GrantType type = 1;
  string id = 2;
  uint64 valid_for_ms = 3;
  string storage_id = 4;
}

message GrantRef {
  GrantType type = 1;
  string id = 2;
}

message GrantResult {
  GrantRef grant = 1;
  bool accepted = 2;
  uint64 valid_for_ms = 3;
}

message ReadReply {
  ReadOutcome outcome = 1;
  repeated Material materials = 2;
  Cached bucket = 3;
  Cached object = 4;
  Cached mapping = 5;
  Cached credential = 6;
  repeated Grant grants = 7;
  ReadCursor next = 8;
  uint64 offset = 9;
  uint64 length = 10;
  uint32 http_status = 11;
  string representation = 12;
  string etag = 13;
  bool body_reused = 14;
  Cached policy = 15;
}
